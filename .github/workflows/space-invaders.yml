name: Generate Space Invaders Activity Animation

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    name: generate-space-shooter-animation
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Generate Space Shooter Contribution Animation
        uses: czl9707/gh-space-shooter@master
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          output-path: ./dist/space-shooter.gif
          strategy: column # column, row, or random
          fps: 20

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
